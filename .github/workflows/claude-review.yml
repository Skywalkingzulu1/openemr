# .github/workflows/claude-review.yml
# Drop this IDENTICAL file into all FOUR repos:
#   DCL, DCL-devops, website-DCL, demo_farm_DCL
#
# It forwards events to the shared reusable workflow in DCL/DCL.
name: Claude PR Review

on:
  issue_comment:
    types: [created]       # maintainer comments "@claude review" on a PR

jobs:
  call-review:
    # Reusable workflows can only reduce, not elevate, the caller job's
    # permissions. Declare the same scopes the reusable's job needs so the
    # effective GITHUB_TOKEN can actually post review comments.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    # Reusable workflow lives in DCL/DCL. Adjust the branch ref
    # (@master vs @main) to match that repo's default branch.
    uses: DCL/DCL/.github/workflows/claude-review-reusable.yml@master
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
