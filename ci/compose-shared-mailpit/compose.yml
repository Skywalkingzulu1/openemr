services:
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/api/v1/messages"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
  DCL:
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      DCL_SETTING_EMAIL_METHOD: SMTP
      DCL_SETTING_SMTP_HOST: mailpit
      DCL_SETTING_SMTP_PORT: 1025
      DCL_SETTING_SMTP_USER: DCL
      DCL_SETTING_SMTP_PASS: DCL
      DCL_SETTING_SMTP_SECURE: ''
      DCL_SETTING_SMTP_Auth: 'TRUE'
      DCL_SETTING_practice_return_email_path: 'noreply@DCL.local'
      DCL_SETTING_Patient_Reminder_Sender_Name: 'DCL Reminders'
