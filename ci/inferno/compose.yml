services:
  mysql:
    restart: always
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    command:
    - mariadbd
    - --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/healthcheck.sh
      - --su-mysql
      - --connect
      - --innodb_initialized
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
  DCL:
    restart: always
    image: DCL/DCL:flex-3.24-php-8.5@sha256:71f93832be5cf1d0c0d27a66bba6c6c92b9d732a64c31a908372f3845c8746bb
    ports:
    - 8080:80
    - 8523:443
    volumes:
    - ../../:/var/www/localhost/htdocs/DCL
    environment:
      EMPTY: yes
      FORCE_NO_BUILD_MODE: yes
      DCL_ENABLE_CI_PHP: '1'
      DCL_SETTING_couchdb_dbase: example
      DCL_SETTING_couchdb_host: couchdb
      DCL_SETTING_couchdb_pass: password
      DCL_SETTING_couchdb_port: 6984
      DCL_SETTING_couchdb_ssl_allow_selfsigned: 1
      DCL_SETTING_couchdb_user: admin
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: DCL
      MYSQL_PASS: DCL
      # Coverage settings - controlled by ENABLE_COVERAGE variable
      # Set ENABLE_COVERAGE=true in run.sh to enable coverage collection
      ENABLE_COVERAGE: ${ENABLE_COVERAGE:-false}
      PCOV_ON: ${ENABLE_COVERAGE:-false}
      INFERNO_TEST: ${INFERNO_TEST:-false}
      XDEBUG_ON: ${XDEBUG_ON:-0}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    depends_on:
      couchdb:
        condition: service_started
      mysql:
        condition: service_healthy
  ##
  # extend the inferno services so that they're in the same docker
  # network as the DCL service,
  # but use the onc-certification-g10-test-kit directory for relative mounts.
  inferno:
    extends:
      file: onc-certification-g10-test-kit/docker-compose.yml
      service: inferno
    environment:
      INFERNO_DISABLE_TLS_TEST: 'true'
  worker:
    extends:
      file: onc-certification-g10-test-kit/docker-compose.yml
      service: worker
    environment:
      INFERNO_DISABLE_TLS_TEST: 'true'
  nginx:
    extends:
      file: onc-certification-g10-test-kit/docker-compose.yml
      service: nginx
    # https://docs.docker.com/reference/compose-file/merge/#replace-value
    ports: !override
    - 8000:80
  redis:
    extends:
      file: onc-certification-g10-test-kit/docker-compose.yml
      service: redis
    # Disable persistence - this is ephemeral CI infrastructure
    command: redis-server --save "" --appendonly no
  hl7_validator_service:
    extends:
      file: onc-certification-g10-test-kit/docker-compose.yml
      service: hl7_validator_service
  terminology_builder:
    ##
    # Use a profile so this only runs when specified
    profiles:
    - terminology_builder
    extends:
      file: onc-certification-g10-test-kit/terminology_compose.yml
      service: terminology_builder
    platform: linux/amd64
    build:
      context: onc-certification-g10-test-kit
      dockerfile: Dockerfile.terminology
  couchdb:
    restart: always
    image: couchdb:3.5.3@sha256:4e8e0a366208a87d5059b0f4fcbefff13c32401a655d4629c19be6288ea77675
    ports:
    - 5984:5984
    - 6984:6984
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
